services:
  - type: web
    name: ivy-homes-assignment
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: IVY_API_KEY
        sync: false
      - key: CITY
        value: Bangalore
      - key: ASSIGNED_LOCALITY
        value: Yelahanka
      - key: PYTHON_VERSION
        value: "3.11.0"
